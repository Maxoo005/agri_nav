name: agri_nav
description: Rolnicza nawigacja GNSS — Flutter + C++
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  # Wykrywanie dostępności sieci
  connectivity_plus: ^6.0.0
  # Trwałe przechowywanie danych (pola uprawowe)
  hive_flutter: ^1.1.0
  # Generowanie unikalnych ID pól
  uuid: ^4.4.0
  # HTTP — zapytania do ULDK / GUGiK
  http: ^1.2.0
  # Real GPS — permissions + position stream
  geolocator: ^13.0.4
  # Bluetooth Classic (SPP) — odbiór NMEA z zewnętrznego odbiornika RTK
  bluetooth_classic: ^0.0.4
  # Bezpieczne przechowywanie hasła do serwera NTRIP (Android Keystore)
  flutter_secure_storage: ^10.3.1
  # SQLite — zapis zadań roboczych do pliku .db
  sqflite: ^2.4.0
  # Łączenie ścieżek w SQLite (getDatabasesPath + plik .db)
  path: ^1.9.0
  # SQLite FFI — backend dla platform desktop (Windows), gdy brak wtyczki sqflite
  sqflite_common_ffi: ^2.3.0
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
